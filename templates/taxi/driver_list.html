{% extends "base.html" %}

{% block content %}
  <h1>Driver List</h1>

  {% if driver_list %}
    <table>
      {% for driver in driver_list %}
        <li><a href="{% url 'taxi:driver-detail' driver.pk %}">{{ driver.first_name }} {{ driver.last_name }}</a></li>
      {% endfor %}
    </table>
  {% else %}
    <p>There are no drivers</p>
  {% endif %}
{% endblock %}
